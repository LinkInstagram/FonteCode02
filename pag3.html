<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lanchonete - Link na Bio</title>
  <style>
      * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-image: url('fundo02.PNG');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  font-family: 'Poppins', sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 400px;
  width: 100%;
  text-align: center;

}

.logo {
  width: 70px;
  margin: 10px auto;
}

.titulo {
  font-size: 2rem;
  color: #ff6600;
  margin: 10px 0 20px;
  font-weight: bold;
  letter-spacing: 2px;
}

.combo-img {
  width: 90%;
  margin: 10px auto 20px;
  border-radius: 12px;

}

.btns {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 30px;
}

.botao {
  background: #ffa500;
  color: #fff;
  text-decoration: none;
  padding: 14px 20px;
  font-size: 1rem;
  font-weight: bold;
  border-radius: 40px;
  justify-content: space-between;
  align-items: center;
  transition: 0.3s ease;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
}

.botao:hover {
  background: #ff7300;
  transform: scale(1.05);
}

.botao img {
  width: 24px;
  height: 24px;
  margin-left: 10px;
}

.redes {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

.redes img {
  width: 30px;
  height: 30px;
  transition: transform 0.2s ease;
}

.redes img:hover {
  transform: scale(1.2);
}

  </style>
</head>
<body>
  <div class="container">
    <img src="516k62qkOIL.png" alt="Logo" class="logo" />
    
    <h1 class="titulo">Sua logo aqui</h1>
    
    <img src="image-removebg-preview (33).png" alt="Combo" class="combo-img" />

    <div class="btns" >
      <a href="https://wa.me/SEUNUMERO" class="botao pedido" >
        <span>FAZER PEDIDO</span>
      </a>
      <a href="#cardapio" class="botao cardapio">
        <span>VER CARDÁPIO</span>
      </a>
      <a href="#endereco" class="botao endereco">
        <span>VER ENDEREÇO</span>
      </a>
    </div>
  </div>
</body>
</html>
